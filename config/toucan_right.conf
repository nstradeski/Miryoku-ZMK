# beekeeb Toucan2 -- taken from the upstream zmk-keyboard-toucan2 config.
# Power/idle tuning below is theirs and is trackpad-specific; see
# https://github.com/beekeeb/zmk-keyboard-toucan2

CONFIG_ZMK_POINTING=y

CONFIG_I2C=y
CONFIG_INPUT_TPS43=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Deep sleep is OFF on every keyboard: see config/no_deep_sleep.conf. (The
# toucan shield's own conf enables it and merges after this file, so it can
# only be turned off from an EXTRA_CONF_FILE, not here.)

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
# This helps A LOT with touchpad power consumption (only 1.7mA idle vs 2.9mA active).  The only user visible aspect is
# that the touchpad needs 300ms to start seeing touches when next pressed - but this behavior is suppressed if we
# have pressed a keyboard key within the last 30 seconds (highly likely).
CONFIG_ZMK_IDLE_TIMEOUT=30000

CONFIG_INPUT_THREAD_STACK_SIZE=2048
