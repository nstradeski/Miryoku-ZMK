# No deep sleep on any keyboard (Typeractive Corne, Corne-ish Zen, Toucan2).
#
# Deep sleep powers a keyboard off completely. Waking it is a reboot: the
# waking keypress is lost and nothing types until both halves restart and
# reconnect over Bluetooth, so you have to mash keys after every break.
# Deliberate trade: always ready, charge more often. ZMK's normal idle mode
# (CONFIG_ZMK_IDLE_TIMEOUT: display off, slower scanning, and on the Toucan
# the trackpad's low-power mode) still saves power between sessions.
#
# This has to be an EXTRA_CONF_FILE, passed to every build after
# pointing.conf: extra conf files merge last. A board or ZMK_CONFIG conf file
# is not enough, because the Zen's board defaults and the Toucan shield's own
# conf turn deep sleep back on after those are merged.
CONFIG_ZMK_SLEEP=n
