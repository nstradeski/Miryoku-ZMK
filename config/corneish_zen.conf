# Corne-ish Zen v2 (both halves; ZMK picks this file up by board name).
#
# The Zen's board defaults turn on deep sleep (CONFIG_ZMK_SLEEP=y) with
# ZMK's stock 15-minute idle timeout. Deep sleep powers the halves off
# completely: the key that wakes it only reboots it, and nothing types
# until both halves have restarted and reconnected over Bluetooth, which
# is why it needed mashing after every short break. The Typeractive Corne
# never deep-sleeps (nice!nano default), and the Toucan2 waits 60 minutes.
#
# Match the Toucan2: deep sleep only after an hour idle. Barely more power
# draw than 15 minutes, and short breaks no longer power it off. To never
# deep-sleep at all (more battery drain), set CONFIG_ZMK_SLEEP=n instead.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
