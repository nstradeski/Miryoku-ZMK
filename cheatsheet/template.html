<!-- Generated by cheatsheet/build.py -- edit the template, not the output. -->
<meta charset="utf-8">
<title>Miryoku Keymap</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#14171c; --muted:#697084; --line:#e0e3ea;
    --accent:#3b6ef5; --accent-ink:#fff; --chip:#eef1f7; --hit:#fff5cc; --hit-line:#e2b93b;
    --shadow:0 10px 30px rgba(16,20,30,.13);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#12141a; --panel:#191c24; --ink:#e9ecf3; --muted:#98a0b4; --line:#2b303c;
    --accent:#5b86ff; --accent-ink:#0b0e14; --chip:#232833; --hit:#3a3212; --hit-line:#b99a2c;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }}
  :root[data-theme=dark]{
    --bg:#12141a; --panel:#191c24; --ink:#e9ecf3; --muted:#98a0b4; --line:#2b303c;
    --accent:#5b86ff; --accent-ink:#0b0e14; --chip:#232833; --hit:#3a3212; --hit-line:#b99a2c;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;}
  .wrap{max-width:1080px;margin:0 auto;padding:14px 16px 28px}

  /* search */
  .searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px}
  #q{width:100%;padding:13px 15px;font-size:17px;color:var(--ink);background:var(--panel);
     border:1px solid var(--line);border-radius:11px;outline:none;box-shadow:var(--shadow)}
  #q:focus{border-color:var(--accent)}
  .hint{color:var(--muted);font-size:12px;margin-top:7px;display:flex;gap:14px;flex-wrap:wrap}
  kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;
      border-radius:5px;padding:1px 6px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}

  /* results */
  .res{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .r{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
     border-radius:10px;padding:10px 13px;cursor:pointer}
  .r:hover,.r.sel{border-color:var(--accent)}
  .r .k{font-weight:650;font-size:15px;min-width:104px}
  .r .k small{display:block;font-weight:450;color:var(--muted);font-size:11.5px}
  .r .d{flex:1;color:var(--ink)}
  .r .d em{font-style:normal;color:var(--muted);display:block;font-size:12.5px}
  .badge{font-size:11px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;
     background:var(--chip);color:var(--muted);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .none{color:var(--muted);padding:18px 2px}

  /* layer tabs */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
       padding:5px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
  .tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .lblurb{color:var(--muted);margin:0 0 12px}
  .lblurb b{color:var(--ink)}

  /* keyboard */
  .kb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
      box-shadow:var(--shadow);overflow-x:auto}
  .row{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
  .gap{width:34px;flex:none}
  .key{width:74px;height:52px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
       padding:5px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;
       text-align:center;flex:none;overflow:hidden}
  .key .l{font-weight:640;font-size:13px;line-height:1.2;word-break:normal;overflow-wrap:break-word;hyphens:none}
  .key.outer .l,.key .l.long{font-size:10.5px;letter-spacing:-.1px}
  .key .s{color:var(--muted);font-size:10px;line-height:1.25;margin-top:2px}
  .key.empty{opacity:.32}
  .key.outer{border-style:dashed}
  .key.hit{background:var(--hit);border-color:var(--hit-line);border-width:2px}
  .thumbs{margin-top:10px}
  .thumbs .key{width:92px;height:46px}
  @media (max-width:760px){.key{width:56px;height:48px}.key .l{font-size:11.5px}.gap{width:18px}}
</style>

<div class="wrap">
  <div class="searchbar">
    <input id="q" placeholder="Search a key or action…  (hash, undo, fullscreen, bluetooth, arrow)" autocomplete="off" spellcheck="false">
    <div class="hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> pick</span>
      <span><kbd>⏎</kbd> show on map</span>
      <span><kbd>esc</kbd> clear</span>
      <span><kbd>⇥</kbd> next layer</span>
    </div>
  </div>
  <div id="results" class="res" hidden></div>
  <div id="browse">
    <div id="tabs" class="tabs"></div>
    <p id="blurb" class="lblurb"></p>
    <div id="kb" class="kb"></div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
let layer = 0, hit = null, sel = 0, results = [];

/* ---------- keyboard render ---------- */
function renderTabs(){
  $("#tabs").innerHTML = DATA.layers.map((L,i)=>
    `<button class="tab${i===layer?' on':''}" data-i="${i}">${L.name}</button>`).join("");
}
function renderKB(){
  const L = DATA.layers[layer];
  $("#blurb").innerHTML = (L.hold ? `<b>To reach it:</b> ${L.hold}. ` : `<b>Always active.</b> `) + L.blurb;
  let html = "";
  for(let r=0;r<3;r++){
    html += `<div class="row">`;
    for(let c=0;c<12;c++){
      if(c===6) html += `<div class="gap"></div>`;
      html += cell(L.keys.find(k=>k.row===r&&k.col===c), r, c);
    }
    html += `</div>`;
  }
  html += `<div class="row thumbs">`;
  for(let c=0;c<6;c++){
    if(c===3) html += `<div class="gap"></div>`;
    html += cell(L.keys.find(k=>k.row===3&&k.col===c), 3, c);
  }
  html += `</div>`;
  $("#kb").innerHTML = html;
}
function cell(k,r,c){
  const on = hit && hit.row===r && hit.col===c ? " hit":"";
  if(!k || !k.label) return `<div class="key empty${on}"></div>`;
  const outer = k.kind==="outer" ? " outer":"";
  const lg = k.label.length>9 ? " long":"";
  return `<div class="key${outer}${on}" title="${esc(k.desc||k.label)}">
    <span class="l${lg}">${esc(k.label)}</span>${k.sub?`<span class="s">${esc(k.sub)}</span>`:""}</div>`;
}
const esc = s => (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ---------- search ---------- */
function score(item,q){
  const l = item.label.toLowerCase(), s = item.search;
  if(l===q) return 0;
  if(item.sub && item.sub.toLowerCase()===q) return 1;
  if(l.startsWith(q)) return 2;
  if(new RegExp("\\b"+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(s)) return 3;
  if(s.includes(q)) return 4;
  return -1;
}
function search(q){
  q = q.trim().toLowerCase();
  if(!q){ results=[]; $("#results").hidden=true; $("#browse").hidden=false; return; }
  results = DATA.index.map(it=>({it,sc:score(it,q)})).filter(x=>x.sc>=0)
            .sort((a,b)=>a.sc-b.sc || a.it.label.length-b.it.label.length)
            .slice(0,40).map(x=>x.it);
  sel = 0;
  $("#browse").hidden = true;
  const box = $("#results"); box.hidden = false;
  if(!results.length){ box.innerHTML = `<div class="none">Nothing matches “${esc(q)}”.</div>`; return; }
  box.innerHTML = results.map((it,i)=>{
    const L = DATA.layers.find(l=>l.id===it.layer);
    let how = L.hold ? `${L.hold}, then <b>${esc(it.where)}</b>` : `just press <b>${esc(it.where)}</b>`;
    if(it.shift && it.shiftWhere) how += ` — while also holding <b>Shift</b> (${esc(it.shiftWhere)})`;
    if(it.also && it.also.length) how += ` · also on ${it.also.map(esc).join(", ")}`;
    return `<div class="r${i===sel?' sel':''}" data-i="${i}">
      <span class="k">${esc(it.label)}${it.sub?`<small>${esc(it.sub)}</small>`:""}</span>
      <span class="d">${esc(it.desc||it.label)}<em>${how}</em></span>
      <span class="badge">${esc(L.name)}</span></div>`;
  }).join("");
}
function reveal(i){
  const it = results[i]; if(!it) return;
  layer = DATA.layers.findIndex(l=>l.id===it.layer);
  hit = {row:it.row, col:it.col};
  $("#q").value = ""; search("");
  renderTabs(); renderKB();
}

/* ---------- events ---------- */
$("#q").addEventListener("input", e=>search(e.target.value));
$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  layer = +b.dataset.i; hit = null; renderTabs(); renderKB();
});
$("#results").addEventListener("click", e=>{
  const r = e.target.closest(".r"); if(r) reveal(+r.dataset.i);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    if($("#q").value){ $("#q").value=""; search(""); }
    else if(window.hsClose) window.hsClose();
    else hit=null, renderKB();
    return;
  }
  if(e.key==="Tab"){ e.preventDefault();
    layer = (layer + (e.shiftKey?-1:1) + DATA.layers.length) % DATA.layers.length;
    hit=null; renderTabs(); renderKB(); return; }
  if(results.length && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    e.preventDefault();
    sel = (sel + (e.key==="ArrowDown"?1:-1) + results.length) % results.length;
    document.querySelectorAll(".r").forEach((n,i)=>n.classList.toggle("sel",i===sel));
    document.querySelector(".r.sel")?.scrollIntoView({block:"nearest"});
    return; }
  if(e.key==="Enter" && results.length){ e.preventDefault(); reveal(sel); return; }
  if(document.activeElement !== $("#q") && e.key.length===1) $("#q").focus();
});

renderTabs(); renderKB(); $("#q").focus();
window.addEventListener("focus", ()=>$("#q").focus());
</script>
