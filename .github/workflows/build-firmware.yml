# Build the personal Miryoku firmware images (Typeractive Corne + Corne-ish
# Zen v2) on every push to master, and on demand, so the .uf2 files can be
# downloaded straight from the run's artifacts without a local toolchain.
#
# This mirrors local-build/build-all.sh exactly: same HWMv2 board names, the
# same nice_view shields for the Corne, and -DEXTRA_CONF_FILE=pointing.conf so
# the Miryoku MOUSE layer (ZMK pointing) is enabled. Only the left/central half
# drives behaviour, but all four halves are built for parity.

name: 'Build Firmware'

on:
  push:
    branches: ['master']
    paths:
      - 'config/**'
      - 'miryoku/**'
      - 'cheatsheet/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        # v0.3.0 uses the flat (pre-HWMv2) board names, not the
        # board/soc/variant form (nice_nano/nrf52840/zmk) that newer ZMK main
        # accepts. These match the official LOWPROKB Zen config + ZMK examples.
        include:
          - name: corne_left
            board: 'nice_nano_v2'
            shield: 'corne_left nice_view_adapter nice_view'
          - name: corne_right
            board: 'nice_nano_v2'
            shield: 'corne_right nice_view_adapter nice_view'
          - name: corneish_zen_v2_left
            board: 'corneish_zen_v2_left'
            shield: ''
          - name: corneish_zen_v2_right
            board: 'corneish_zen_v2_right'
            shield: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'miryoku_zmk'

      - name: Clone ZMK
        # Pinned to the v0.3.0 release (not main): ZMK main has a deep-sleep
        # regression where the split CENTRAL half fails to wake and drains the
        # battery (zmkfirmware/zmk#3207), not present in v0.3. Pinning also makes
        # builds reproducible. v0.3.0 still uses HWMv2 board names.
        run: git clone --branch v0.3.0 --depth 1 https://github.com/zmkfirmware/zmk.git zmk

      - name: Cache Zephyr/modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            zmk/modules/
            zmk/zephyr/
          key: zephyr-${{ runner.os }}-${{ hashFiles('zmk/app/west.yml') }}

      - name: West init/update
        working-directory: zmk
        run: |
          west init -l app
          west update
          west zephyr-export

      - name: Build ${{ matrix.name }}
        working-directory: zmk
        shell: bash
        run: |
          # Run from the zmk topdir with -s app (mirrors build-all.sh).
          # Array keeps the multi-word -DSHIELD as a single argument.
          args=(-p -s app -d "build/${{ matrix.name }}" -b "${{ matrix.board }}" --
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/miryoku_zmk/config"
            -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/miryoku_zmk/config/pointing.conf")
          if [ -n "${{ matrix.shield }}" ]; then
            args+=(-DSHIELD="${{ matrix.shield }}")
          fi
          west build "${args[@]}"

      - name: Stage artifact
        run: |
          mkdir -p firmware
          cp "zmk/build/${{ matrix.name }}/zephyr/zmk.uf2" "firmware/${{ matrix.name }}.uf2"

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: 'firmware-${{ matrix.name }}'
          path: 'firmware/${{ matrix.name }}.uf2'
          if-no-files-found: error

  cheatsheet:
    # Regenerated from the same sources the images are built from, so the
    # reference can never describe a firmware you aren't running. Ships inside
    # the miryoku-firmware bundle next to the .uf2 files, AND is committed back
    # so the copy in the repo is always current without anyone running the
    # generator by hand.
    name: Keymap cheat sheet
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit-back can rebase if the branch moved.
          fetch-depth: 0

      - name: Generate cheat sheet
        # build.py expands the real layer macros with cpp (present on the
        # runner) -- no Python packages needed.
        run: python3 cheatsheet/build.py

      - name: Upload cheat sheet
        uses: actions/upload-artifact@v4
        with:
          name: 'cheatsheet'
          path: 'cheatsheet/miryoku-cheatsheet.html'
          if-no-files-found: error

      - name: Commit regenerated cheat sheet
        # Pushes made with GITHUB_TOKEN do not re-trigger workflows, so this
        # cannot loop. Never fails the run: a docs commit must not block
        # firmware delivery.
        if: github.event_name != 'pull_request'
        env:
          SHEET: cheatsheet/miryoku-cheatsheet.html
        run: |
          if git diff --quiet -- "$SHEET"; then
            echo "Cheat sheet already up to date; nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SHEET"
          git commit -m 'chore(cheatsheet): regenerate from keymap [skip ci]'
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Committed the regenerated cheat sheet to $GITHUB_REF_NAME."
              exit 0
            fi
            echo "push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "::warning::Could not push the regenerated cheat sheet. If this is a 403, enable Settings -> Actions -> General -> Workflow permissions -> Read and write permissions. The copy in this run's artifact is still correct."

  bundle:
    name: Bundle all firmware
    needs: [build, cheatsheet]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect images
        uses: actions/download-artifact@v4
        with:
          pattern: 'firmware-*'
          path: bundle
          merge-multiple: true

      - name: Collect cheat sheet
        # Never block firmware delivery on the reference doc.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: 'cheatsheet'
          path: bundle

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: 'miryoku-firmware'
          path: |
            bundle/*.uf2
            bundle/*.html
          if-no-files-found: error
