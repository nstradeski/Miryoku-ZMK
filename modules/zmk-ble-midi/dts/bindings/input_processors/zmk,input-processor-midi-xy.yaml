description: |
  Trackpad as a MIDI controller. One finger: X/Y drive two CCs (param1 = X CC,
  param2 = Y CC). Two fingers up/down: note velocity slider. Pinch: a third CC.

compatible: "zmk,input-processor-midi-xy"

include: ip_two_param.yaml

properties:
  channel:
    type: int
    default: 0
    description: MIDI channel 1-16 for everything this sends; 0 = the current channel.
  wheel-cc:
    type: int
    default: -1
    description: Two-finger up/down sends this CC instead of acting as the velocity slider. -1 = velocity slider.
  divisor:
    type: int
    default: 4
    description: One-finger movement units per CC step. Higher = finer, more travel.
  velocity-divisor:
    type: int
    default: 2
    description: Two-finger scroll units per velocity (or wheel-cc) step.
  velocity-invert:
    type: boolean
    description: Flip the velocity slider if moving fingers up makes notes quieter.
  pinch-cc:
    type: int
    default: 18
    description: CC sent by pinching (spread = up). -1 turns pinch off.
  pinch-divisor:
    type: int
    default: 2
    description: Pinch units per CC step.
